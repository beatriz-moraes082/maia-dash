<style>
  :root {
    --plane:#F1ECE3; --surface:#FFFFFF; --line:#E6DFD3; --line2:#EFEAE1;
    --ink:#14212E; --ink2:#566573; --mut:#8C98A4;
    --navy:#0A2540; --navy2:#0F3358; --navy3:#16507F;
    --blue:#1FA8E0; --blue-d:#1787C2; --blue-soft:#DCEFF8;
    --good:#1F9D5B; --warn:#D9861A; --bad:#D04A3A; --neutral:#A7B1BB;
    --grad:linear-gradient(135deg,#0A2540 0%,#0F3358 55%,#17558A 100%);
    --radius:16px; --shadow:0 1px 2px rgba(20,33,46,.05), 0 6px 20px -12px rgba(20,33,46,.18);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--plane); color:var(--ink); font-family:Inter,system-ui,sans-serif; font-size:14px; line-height:1.45; }
  .mono { font-family:'JetBrains Mono',ui-monospace,monospace; }

  /* ── topo ── */
  .top { background:var(--grad); color:#fff; position:relative; overflow:hidden; }
  .top::after { content:''; position:absolute; right:-120px; top:-160px; width:460px; height:460px; border-radius:50%;
    background:radial-gradient(circle,rgba(31,168,224,.22) 0%,transparent 68%); pointer-events:none; }
  .top-in { max-width:1320px; margin:0 auto; padding:18px 28px 0; position:relative; z-index:1; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand img { width:40px; height:40px; border-radius:10px; object-fit:cover; background:#fff; }
  .brand-name { font-weight:700; font-size:16px; letter-spacing:.2px; }
  .brand-sub { font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:#9fc3dc; margin-top:1px; }
  .brand-right { margin-left:auto; text-align:right; font-size:11px; color:#9fb6c9; }
  .brand-right strong { color:#fff; font-weight:600; }
  .tabs { display:flex; gap:4px; margin-top:18px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { appearance:none; border:0; background:transparent; color:#b5c8d8; font:inherit; font-weight:600; font-size:13px;
    padding:11px 16px 13px; border-radius:12px 12px 0 0; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:7px; }
  .tab .n { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#6f93b2; }
  .tab:hover { color:#fff; }
  .tab.active { background:var(--plane); color:var(--navy); }
  .tab.active .n { color:var(--blue-d); }
  .tab .badge { background:var(--blue); color:#fff; font-size:10.5px; border-radius:20px; padding:1px 7px; }
  .tab.active .badge { background:var(--navy); }

  .wrap { max-width:1320px; margin:0 auto; padding:22px 28px 40px; }

  /* ── período ── */
  .period { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px; padding:10px 12px 10px 18px; flex-wrap:wrap; margin-bottom:22px; }
  .period-lbl { font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--mut); font-family:'JetBrains Mono',monospace; }
  .chips { display:flex; gap:4px; background:var(--line2); padding:4px; border-radius:12px; flex-wrap:wrap; }
  .chip { appearance:none; border:0; background:transparent; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink2);
    padding:7px 13px; border-radius:9px; cursor:pointer; }
  .chip:hover { color:var(--navy); }
  .chip.active { background:var(--navy); color:#fff; box-shadow:0 2px 8px -3px rgba(10,37,64,.5); }
  .custom { display:flex; gap:8px; align-items:center; }
  .custom[hidden] { display:none; }
  .custom input { font:inherit; font-size:12.5px; color:var(--navy); border:1px solid var(--line); border-radius:9px; padding:6px 8px; background:#fff; }
  .custom button { appearance:none; border:0; font:inherit; font-weight:600; font-size:12.5px; background:var(--blue-d); color:#fff; border-radius:9px; padding:7px 14px; cursor:pointer; }
  .range { margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink2); }

  /* ── seções e grid ── */
  .sec { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--mut);
    margin:26px 2px 10px; display:flex; align-items:center; gap:10px; }
  .sec::after { content:''; flex:1; height:1px; background:var(--line); }
  .grid { display:grid; gap:14px; }
  .g6 { grid-template-columns:repeat(6,minmax(0,1fr)); }
  .g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .g21 { grid-template-columns:minmax(0,2fr) minmax(0,1fr); }
  .span2 { grid-column:span 2; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; min-width:0; }
  .card.dark { background:var(--grad); border-color:transparent; color:#fff; position:relative; overflow:hidden; }
  .card.dark::after { content:''; position:absolute; right:-60px; bottom:-90px; width:240px; height:240px; border-radius:50%;
    background:radial-gradient(circle,rgba(31,168,224,.25) 0%,transparent 70%); pointer-events:none; }
  .card.dark > * { position:relative; z-index:1; }
  .card-h { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .card-t { font-weight:700; font-size:14.5px; color:var(--navy); }
  .card.dark .card-t { color:#fff; }
  .card-s { font-size:11.5px; color:var(--mut); text-align:right; }
  .card.dark .card-s { color:#9fb6c9; }
  .note { font-size:12px; color:var(--ink2); margin-top:12px; line-height:1.5; }
  .card.dark .note { color:#b9cbdb; }
  .note strong { color:var(--ink); }
  .card.dark .note strong { color:#fff; }

  /* ── KPI ── */
  .kpi { padding:16px 18px 14px; display:flex; flex-direction:column; gap:4px; }
  .kpi-l { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--mut); }
  .card.dark .kpi-l { color:#8fb3cf; }
  .kpi-v { font-size:26px; font-weight:700; letter-spacing:-.5px; color:var(--navy); line-height:1.15; white-space:nowrap; }
  .kpi-v small { font-size:13px; font-weight:600; color:var(--mut); letter-spacing:0; }
  .card.dark .kpi-v { color:#fff; }
  .card.dark .kpi-v small { color:#9fc3dc; }
  .kpi-m { font-size:11.5px; color:var(--ink2); }
  .card.dark .kpi-m { color:#b9cbdb; }
  .delta { font-size:11.5px; font-weight:600; }
  .delta.up { color:var(--good); } .delta.down { color:var(--bad); } .delta.flat, .delta.neutral { color:var(--mut); }
  .card.dark .delta.up { color:#6fe0a2; } .card.dark .delta.down { color:#ff9a8a; } .card.dark .delta.flat, .card.dark .delta.neutral { color:#9fb6c9; }
  .delta span { font-weight:500; color:var(--mut); }
  .card.dark .delta span { color:#8fb3cf; }
  .spark { height:30px; margin-top:6px; }
  .spark svg { width:100%; height:30px; display:block; overflow:visible; }

  /* ── hero ── */
  .hero { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:14px; }
  .kicker { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--blue-d); display:flex; align-items:center; gap:7px; }
  .kicker::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--blue); }
  .hero h1 { font-family:'Playfair Display',serif; font-weight:600; font-size:30px; line-height:1.15; color:var(--navy); margin:10px 0 8px; }
  .hero p { color:var(--ink2); margin:0; font-size:13.5px; }
  .big { font-size:52px; font-weight:700; letter-spacing:-1.5px; line-height:1; margin:10px 0 6px; }
  .big small { font-size:18px; font-weight:600; color:#9fc3dc; letter-spacing:0; margin-left:4px; }
  .prog { height:8px; border-radius:6px; background:rgba(255,255,255,.14); overflow:hidden; margin:12px 0 6px; }
  .prog > div { height:100%; border-radius:6px; background:linear-gradient(90deg,#1FA8E0,#7fd3f5); }
  .hero-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:16px; }
  .hero-list div { background:var(--line2); border-radius:12px; padding:10px 12px; }
  .hero-list b { display:block; font-size:18px; color:var(--navy); }
  .hero-list span { font-size:11px; color:var(--ink2); }

  /* ── barras horizontais ── */
  .hbars { display:flex; flex-direction:column; gap:9px; }
  .hbar { display:grid; grid-template-columns:minmax(110px,190px) minmax(0,1fr) 54px; gap:12px; align-items:center; font-size:12.5px; }
  .hbar .lb { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .hbar .tr { height:10px; background:var(--line2); border-radius:5px; overflow:hidden; position:relative; }
  .hbar .fl { height:100%; border-radius:5px; background:var(--blue-d); }
  .hbar .vl { text-align:right; font-weight:600; color:var(--navy); font-variant-numeric:tabular-nums; }
  .card.dark .hbar .lb { color:#dbe7f1; } .card.dark .hbar .tr { background:rgba(255,255,255,.1); }
  .card.dark .hbar .fl { background:linear-gradient(90deg,#1FA8E0,#7fd3f5); } .card.dark .hbar .vl { color:#fff; }

  /* ── funil ── */
  .funnel { display:flex; flex-direction:column; gap:8px; }
  .fstep { display:grid; grid-template-columns:150px minmax(0,1fr) 92px; gap:12px; align-items:center; }
  .fstep .fn { font-size:12.5px; color:#dbe7f1; }
  .fstep .fb { height:34px; border-radius:8px; background:rgba(255,255,255,.08); overflow:hidden; }
  .fstep .fb > div { height:100%; border-radius:8px; background:linear-gradient(90deg,#1FA8E0,#6fcaf0); display:flex; align-items:center; padding-left:10px;
    font-weight:700; color:#06223a; font-size:13px; min-width:34px; }
  .fstep .fp { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#9fc3dc; text-align:right; }

  /* ── pilha de status ── */
  .stack { display:flex; height:16px; border-radius:6px; overflow:hidden; gap:2px; background:var(--surface); }
  .stack > div { height:100%; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink2); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  /* ── gráfico diário ── */
  .chart { position:relative; }
  .chart svg { width:100%; display:block; overflow:visible; }
  .chart .ax { font-size:10.5px; fill:var(--mut); font-family:Inter,sans-serif; }
  .chart .gl { stroke:var(--line2); stroke-width:1; }
  .tip { position:absolute; pointer-events:none; background:var(--navy); color:#fff; font-size:12px; border-radius:10px; padding:8px 10px;
    box-shadow:0 8px 24px -8px rgba(10,37,64,.5); white-space:nowrap; transform:translate(-50%,-110%); opacity:0; transition:opacity .12s; z-index:5; }
  .tip b { font-weight:700; }
  .tip .tl { color:#9fc3dc; font-size:11px; margin-bottom:3px; }

  /* ── heatmap ── */
  .heat-wrap { overflow-x:auto; }
  .heat { display:grid; grid-template-columns:34px repeat(24,minmax(15px,1fr)); gap:3px; min-width:560px; }
  .heat .hh { font-size:9.5px; color:#8fb3cf; }
  .heat .hd { font-size:11px; font-weight:600; color:#dbe7f1; align-self:center; }
  .heat .hc { height:22px; border-radius:4px; background:rgba(255,255,255,.06); position:relative; }
  .heat .hc::after { content:''; position:absolute; inset:0; border-radius:4px; background:#35bdf0; opacity:var(--a); }
  .heat .hc.com { box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); }
  .heat .hc:hover { outline:2px solid #fff; outline-offset:0; z-index:2; }

  /* ── colunas verticais (dia da semana / hora) ── */
  .cols { display:grid; align-items:end; gap:4px; height:130px; }
  .cols .c { position:relative; background:var(--blue-d); border-radius:4px 4px 0 0; min-height:2px; }
  .cols .c:hover { background:var(--navy); }
  .cols-x { display:grid; gap:4px; margin-top:6px; font-size:10.5px; color:var(--mut); text-align:center; }

  /* ── tabela ── */
  .tbl-wrap { overflow-x:auto; margin:0 -4px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--mut); font-weight:500;
    text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; }
  th.num, td.num { text-align:right; }
  th:hover { color:var(--navy); }
  th.asc::after { content:' ↑'; color:var(--blue-d); } th.desc::after { content:' ↓'; color:var(--blue-d); }
  td { padding:10px 8px; border-bottom:1px solid var(--line2); vertical-align:middle; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover td { background:#FAF7F1; }
  td .nm { font-weight:600; color:var(--navy); }
  td .sb { font-size:11px; color:var(--mut); max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini { height:6px; background:var(--line2); border-radius:4px; overflow:hidden; margin-top:5px; min-width:70px; }
  .mini > div { height:100%; background:var(--blue-d); border-radius:4px; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .pill.ok { background:#E3F4EA; color:#17774A; } .pill.muted { background:var(--line2); color:var(--ink2); }
  .pill.warn { background:#FBEBD3; color:#94570C; } .pill.bad { background:#F8E0DC; color:#A2301F; }
  .pill.topo { background:var(--blue-soft); color:#11648F; }
  .tag-w { color:var(--warn); font-weight:700; } .tag-b { color:var(--bad); font-weight:700; } .tag-g { color:var(--good); font-weight:700; }
  .toggle { display:flex; gap:4px; background:var(--line2); padding:3px; border-radius:10px; }
  .toggle button { appearance:none; border:0; background:transparent; font:inherit; font-size:12px; font-weight:600; color:var(--ink2); padding:5px 11px; border-radius:8px; cursor:pointer; }
  .toggle button.active { background:#fff; color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.08); }

  /* ── plano de ação (checklist) ── */
  .plan-head { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:14px; margin-bottom:6px; }
  .plan-filter { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:18px 2px 10px; }
  .todo { display:flex; flex-direction:column; gap:10px; }
  .item { display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:14px; align-items:start; background:var(--surface);
    border:1px solid var(--line); border-left:4px solid var(--neutral); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
  .item.alta { border-left-color:var(--bad); } .item.media { border-left-color:var(--warn); } .item.boa { border-left-color:var(--good); }
  .item.done { opacity:.55; } .item.done .it { text-decoration:line-through; }
  .item input { width:20px; height:20px; margin:2px 0 0; accent-color:var(--navy); cursor:pointer; }
  .it { font-weight:700; color:var(--navy); font-size:14px; }
  .id { color:var(--ink2); font-size:12.5px; margin-top:3px; }
  .im { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .when { font-size:11px; color:var(--mut); white-space:nowrap; }
  .empty { text-align:center; color:var(--mut); padding:30px; }

  .foot { text-align:center; color:var(--mut); font-size:11.5px; margin-top:34px; }
  .foot img { height:26px; opacity:.8; display:block; margin:8px auto 0; }

  .view[hidden] { display:none; }
  @media (max-width:1100px) { .g6 { grid-template-columns:repeat(3,minmax(0,1fr)); } .g4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:820px) {
    .top-in, .wrap { padding-left:16px; padding-right:16px; }
    .brand-right { display:none; }
    .hero, .g21, .g3, .g2, .plan-head { grid-template-columns:minmax(0,1fr); }
    .span2 { grid-column:auto; }
    .g6, .g4 { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .hero h1 { font-size:24px; } .big { font-size:40px; }
    .range { margin-left:0; width:100%; }
    .hbar { grid-template-columns:minmax(90px,120px) minmax(0,1fr) 44px; }
    .fstep { grid-template-columns:100px minmax(0,1fr) 70px; }
    .hero-list { grid-template-columns:minmax(0,1fr); }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>

  function semana(d) {  // segunda-feira da semana (as tarefas renovam toda segunda)
    var x = parse(d), wd = (x.getUTCDay() + 6) % 7; return iso(add(x, -wd));
  }
  function planItems() {

    var items = [], time = CA.list.filter(function(c) { return c.nome !== BALDE; });
    function push(prio, cat, key, titulo, det, quem) { items.push({ id: wk + '|' + key, prio: prio, cat: cat, titulo: titulo, det: det, quem: quem || 'Roberto' }); }
    time = time.filter(function(c) { return !GESTOR.test(c.nome); });
    var par = time.filter(function(c) { return c.parados >= 5; }).sort(function(a, b) { return b.parados - a.parados; });
    par.slice(0, 3).forEach(function(c) {
      var pr = c.carteira ? c.parados / c.carteira : 0;
      push(0, 'Carteira parada', 'parados|' + c.uid, 'Cobrar retorno dos ' + int(c.parados) + ' negócios parados de ' + c.nome,
        int(c.parados) + ' de ' + int(c.carteira) + ' negócios abertos (' + pct(pr * 100) + ') sem atualização há 5+ dias. Combinar prazo pra retomar; o que não andar até lá, redistribuir.', c.nome);
    });
    if (par.length > 3)
      push(1, 'Carteira parada', 'parados|resto', 'Revisar a carteira parada do restante do time',
        par.slice(3).map(function(c) { return c.nome + ' (' + c.parados + ' de ' + c.carteira + ')'; }).join(', ') + ' — negócios sem atualização há 5+ dias.');
    if (CA.tot.velhos >= 10)
      push(1, 'Reativação', 'velhos', 'Rodar a limpeza e reativação mensal da base',
        int(CA.tot.velhos) + ' negócios abertos sem movimento há 30+ dias. Mover pra Perdido, disparar o WhatsApp de reativação e mandar quem responder pros corretores de melhor conversão.');
    var desb = C.media >= 3 ? C.list.filter(function(c) { return c.nome !== BALDE && !GESTOR.test(c.nome) && c.rec && (c.idx >= 1.6 || c.idx <= 0.5); }) : [];

    var tq = C.tot.rec ? C.tot.qualif / C.tot.rec * 100 : 0;

    var zero = time.map(cmOf).filter(function(cm) { return cm && cm.rec >= 10 && cm.qualif === 0; });

    var semM = time.filter(function(c) { return c.semMotivo >= 1; });

    if (HZ.tot >= 20 && HZ.fora / HZ.tot >= 0.4)
      push(0, 'SLA de atendimento', 'sla', 'Definir plantão pra noite e fim de semana',
        pct(HZ.fora / HZ.tot * 100) + ' dos leads dos últimos 30 dias chegaram fora do horário comercial (' + pct(HZ.fds / HZ.tot * 100) + ' no fim de semana, pico ' + DIAS[HZ.best[0]] + ' ' + HZ.best[1] + 'h). Escala de plantão ou primeira resposta automática.');
    var fu = CA.stagesHoje['Follow up'] || 0;
    if (CA.tot.carteira && fu / CA.tot.carteira >= 0.4)
      push(1, 'Funil', 'followup', 'Destravar os ' + int(fu) + ' negócios em Follow up',
        pct(fu / CA.tot.carteira * 100) + ' da carteira aberta está em Follow up. Definir cadência de retomada e critério pra mover pra Qualificado ou Perdido.');
    var inf = CA.stagesHoje['Interesse Futuro'] || 0;
    if (inf >= 10)
      push(1, 'Funil', 'interesse', 'Agendar retomada dos ' + int(inf) + ' leads em Interesse futuro', 'Definir data de retorno pra cada um, pra não virarem base morta.');
    var top = time.map(cmOf).filter(function(cm) { return cm && cm.rec >= 8; }).sort(function(a, b) { return b.conv - a.conv; })[0];
    if (top && top.qualif > 0)
      push(2, 'Boa prática', 'top|' + top.uid, 'Reconhecer ' + top.nome + ' e replicar a abordagem',
        'Melhor conversão dos últimos 30 dias: ' + pct(top.conv) + ' (' + int(top.qualif) + ' de ' + int(top.rec) + '). Compartilhar o roteiro com o time; bom candidato pro grupo de reativação.', top.nome);
    items.sort(function(a, b) { return a.prio - b.prio; });
    return items;
  }
  function viewPlano() {
    var items = planItems(), done = loadDone(), feitos = items.filter(function(i) { return done[i.id]; }).length;
    var hoje = D.crm ? (D.crm.hoje || D.today) : D.today;
    document.getElementById('plan-badge').textContent = items.length - feitos || '';
    var h = [], p = items.length ? feitos / items.length * 100 : 0;
    h.push('<div class="plan-head">');
    h.push('<div class="card dark"><div class="kpi-l">Progresso da semana</div><div class="big">' + feitos + '<small>de ' + items.length + ' feitas</small></div><div class="prog"><div style="width:' + p.toFixed(1) + '%"></div></div>' +
      '<div class="note">As tarefas renovam toda segunda com base na carteira do dia. Suas marcações ficam salvas <strong>neste navegador</strong>.</div></div>');
    h.push('<div class="card"><div class="kicker">Plano de ação comercial</div><h1 style="font-family:\'Playfair Display\',serif;font-size:24px;color:var(--navy);margin:8px 0 6px">O que cobrar do time esta semana</h1>' +
      '<p style="margin:0;color:var(--ink2);font-size:13px">Gerado em ' + br(hoje) + ' a partir da carteira de hoje e dos últimos 30 dias na TeciMob. Não muda com o filtro de período. Alta = resolver esta semana; média = acompanhar; positiva = reconhecer.</p></div>');
    h.push('</div>');
    h.push('<div class="plan-filter"><div class="sec" style="margin:0;flex:1">Tarefas</div><div class="toggle" role="group" aria-label="Filtro">' +
      ['pendentes', 'feitas', 'todas'].map(function(f) { return '<button data-plan="' + f + '"' + (state.planFilter === f ? ' class="active"' : '') + '>' + f.charAt(0).toUpperCase() + f.slice(1) + '</button>'; }).join('') + '</div></div>');
    var vis = items.filter(function(i) { return state.planFilter === 'todas' || (state.planFilter === 'feitas' ? done[i.id] : !done[i.id]); });
    var PR = [['Alta', 'alta', 'bad'], ['Média', 'media', 'warn'], ['Positiva', 'boa', 'ok']];
    h.push('<div class="todo">');
    if (!vis.length) h.push('<div class="card empty">' + (state.planFilter === 'pendentes' && items.length ? 'Tudo feito por esta semana. 👏' : 'Nada por aqui.') + '</div>');
    vis.forEach(function(i) {
      var pr = PR[i.prio], d = done[i.id];
      h.push('<label class="item ' + pr[1] + (d ? ' done' : '') + '"><input type="checkbox" data-id="' + esc(i.id) + '"' + (d ? ' checked' : '') + '>' +
        '<div><div class="it">' + esc(i.titulo) + '</div><div class="id">' + esc(i.det) + '</div><div class="im"><span class="pill ' + pr[2] + '">' + pr[0] + '</span><span class="pill muted">' + esc(i.cat) + '</span>' +
        (i.quem !== 'Roberto' ? '<span class="pill topo">' + esc(i.quem) + '</span>' : '') + '</div></div>' +
        '<div class="when">' + (d ? 'feito em ' + brs(d) : '') + '</div></label>');
    });
    h.push('</div>');
    return h.join('');
  }

  // ── render ──
  function render() {
    var r = ranges(state.preset, state.cs, state.cu);
    document.getElementById('range').textContent = brs(r.since) + ' → ' + brs(r.until) + '/' + r.until.slice(0, 4);
    var A = metaAgg(r.since, r.until), P = metaAgg(r.ps, r.pe);
    var C = crmAgg(r.since, r.until, state.origem), CP = crmAgg(r.ps, r.pe, state.origem), HZ = heatAgg(r.since, r.until);
    var v = state.view, html;
    if (v === 'geral') html = viewGeral(r, A, P, C, CP, HZ);
    else if (v === 'funil') html = viewFunil(r, A, C, CP);
    else if (v === 'corretores') html = viewCorretores(r, C);
    else if (v === 'horarios') html = viewHorarios(r, HZ);
    else if (v === 'campanhas') html = viewCampanhas(r, A, P);
    else html = viewPlano();
    var el = document.getElementById('v-' + v);
    el.innerHTML = html;
    initSort(el);
    if (v !== 'plano') viewPlanoBadge();
  }
  function viewPlanoBadge() {
    var items = planItems(), done = loadDone();
    document.getElementById('plan-badge').textContent = items.filter(function(i) { return !done[i.id]; }).length || '';
  }

  function initSort(root) {
    root.querySelectorAll('table.sortable').forEach(function(table) {
      var ths = table.tHead.rows[0].cells;
      Array.prototype.forEach.call(ths, function(th, idx) {
        th.addEventListener('click', function() {
          var asc = !th.classList.contains('asc');
          Array.prototype.forEach.call(ths, function(o) { o.classList.remove('asc', 'desc'); });
          th.classList.add(asc ? 'asc' : 'desc');
          var rows = Array.prototype.slice.call(table.tBodies[0].rows);
          rows.sort(function(a, b) {
            var x = a.cells[idx], y = b.cells[idx];
            var av = x && x.getAttribute('data-v') !== null ? parseFloat(x.getAttribute('data-v')) : (x ? x.textContent.trim().toLowerCase() : '');
            var bv = y && y.getAttribute('data-v') !== null ? parseFloat(y.getAttribute('data-v')) : (y ? y.textContent.trim().toLowerCase() : '');
            return (av < bv ? -1 : av > bv ? 1 : 0) * (asc ? 1 : -1);
          });
          rows.forEach(function(rw) { table.tBodies[0].appendChild(rw); });
        });
      });
    });
  }

  // ── eventos ──
  document.getElementById('tabs').addEventListener('click', function(e) {
    var b = e.target.closest('.tab'); if (!b) return;
    state.view = b.getAttribute('data-view');
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t === b); });
    document.querySelectorAll('.view').forEach(function(v) { v.hidden = v.id !== 'v-' + state.view; });
    document.getElementById('period-bar').style.display = state.view === 'plano' ? 'none' : '';
    try { history.replaceState(null, '', '#' + state.view); } catch (err) {}
    render();
  });
  var chips = document.getElementById('chips'), form = document.getElementById('custom'), fs = document.getElementById('cs'), fu = document.getElementById('cu');
  chips.addEventListener('click', function(e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var p = b.getAttribute('data-p');
    if (p === 'custom') {
      form.hidden = !form.hidden;
      if (!fs.value) { var r0 = ranges('ultimos_30'); fs.value = r0.since; fu.value = r0.until; }
      return;
    }
    form.hidden = true; state.preset = p;
    chips.querySelectorAll('.chip').forEach(function(c) { c.classList.toggle('active', c === b); });
    render();
  });
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var s = fs.value, u = fu.value; if (!s || !u) return;
    if (s > u) { var tmp = s; s = u; u = tmp; fs.value = s; fu.value = u; }
    state.preset = 'custom'; state.cs = s; state.cu = u;
    chips.querySelectorAll('.chip').forEach(function(c) { c.classList.toggle('active', c.getAttribute('data-p') === 'custom'); });
    render();
  });
  document.querySelector('main').addEventListener('click', function(e) {
    var o = e.target.closest('[data-origem]');
    if (o) { state.origem = o.getAttribute('data-origem'); render(); return; }
    var f = e.target.closest('[data-plan]');
    if (f) { state.planFilter = f.getAttribute('data-plan'); render(); }
  });
  document.querySelector('main').addEventListener('change', function(e) {
    var cb = e.target.closest('input[type=checkbox][data-id]'); if (!cb) return;
    var done = loadDone();
    if (cb.checked) done[cb.getAttribute('data-id')] = iso(new Date()); else delete done[cb.getAttribute('data-id')];
    saveDone(done);
    setTimeout(render, 180);
  });
  // tooltip
  var tip = document.getElementById('tip');
  document.addEventListener('mousemove', function(e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.opacity = 0; return; }
    tip.innerHTML = t.getAttribute('data-tip');
    tip.style.left = e.clientX + window.scrollX + 'px'; tip.style.top = e.clientY + window.scrollY - 8 + 'px'; tip.style.opacity = 1;
  });

  var hash = (location.hash || '').slice(1);
  var start = document.querySelector('.tab[data-view="' + hash + '"]');
  if (start) start.click(); else render();
})();
</script>
</body>
</html>
