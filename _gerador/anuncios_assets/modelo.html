<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anúncios ativos · Maia Imóveis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Gerado por anuncios_ativos.py. Layout: faixa escura com ondas (igual à roleta) e corpo creme com grade de cards por empreendimento. */
:root{--ink:#212121;--cream:#e8e8e4;--paper:#f3f3f0;--signal:#ed4e23;--signal-ink:#ffffff;--muted:#585d55;--line:#d6d6d0;
--heading:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;--text:"Instrument Sans",system-ui,-apple-system,sans-serif;--radius:12px;color-scheme:light}
body{background:var(--cream);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.5}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1040px;margin:0 auto}
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--cream);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 36px);padding-bottom:40px}
.hero svg.waves{position:absolute;inset:0;width:100%;height:100%}
.hero .inner{position:relative;display:flex;flex-direction:column;gap:28px}
.logo{height:30px;width:auto;align-self:flex-start}
.hero h1{font-family:var(--heading);font-weight:600;font-size:clamp(2.1rem,6vw,3.25rem);line-height:1.05;letter-spacing:-.02em;margin:0;max-width:16ch;text-wrap:balance}
.hero p{margin:12px 0 0;max-width:56ch;color:color-mix(in oklab,var(--cream) 72%,transparent)}
.stamp{font-size:.8rem;letter-spacing:.04em;color:color-mix(in oklab,var(--cream) 60%,transparent)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid color-mix(in oklab,var(--cream) 22%,transparent);color:var(--cream);text-decoration:none;font-size:.85rem;font-weight:500}
nav a span{font-variant-numeric:tabular-nums;color:color-mix(in oklab,var(--cream) 55%,transparent)}
nav a:hover{border-color:var(--signal)}
main{padding-block:36px 56px}
main .inner{display:flex;flex-direction:column;gap:44px}
section{scroll-margin-top:16px;display:flex;flex-direction:column;gap:16px}
section header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
h2{font-family:var(--heading);font-weight:600;font-size:1.6rem;letter-spacing:-.01em;margin:0}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.note{margin:0;color:var(--muted);font-size:.9rem;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{position:relative;display:block;aspect-ratio:4/5;background:var(--ink);overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
a.thumb:hover img{transform:scale(1.03)}
.play{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--signal);color:var(--signal-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgb(0 0 0 / .3)}
.play svg{width:22px;height:22px;margin-left:3px}
.dur{position:absolute;right:8px;bottom:8px;background:rgb(33 33 33 / .8);color:#f3f3f0;font-size:.75rem;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h3{font-family:var(--heading);font-weight:600;font-size:1.05rem;line-height:1.25;margin:0}
.code{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.meta{margin:0;color:var(--muted);font-size:.85rem}
.btn{margin-top:auto;display:block;text-align:center;padding:10px 12px;border-radius:var(--radius);background:var(--signal);color:var(--signal-ink);text-decoration:none;font-weight:500;font-size:.9rem}
.btn:hover{filter:brightness(.95)}
.pending{margin-top:auto;display:block;text-align:center;padding:9px 12px;border-radius:var(--radius);border:1px dashed var(--line);color:var(--muted);font-size:.85rem}
a:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
footer{padding-block:0 40px;color:var(--muted);font-size:.8rem}
footer .inner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
footer img{height:20px;width:auto}
@media (prefers-reduced-motion:reduce){.thumb img{transition:none}}
</style>
</head>
<body>
<div class="hero pad">
<svg class="waves" viewBox="0 0 600 800" preserveAspectRatio="none" aria-hidden="true">{{ONDAS}}</svg>
<div class="inner">
<img class="logo" src="trilha-logo.png" alt="Trilha">
<div>
<h1>Anúncios ativos</h1>
<p>Toque no criativo para ver o anúncio completo e saber o que o cliente assistiu.</p>
</div>
<nav aria-label="Empreendimentos">{{NAV}}</nav>
<span class="stamp">Atualizado em {{QUANDO}}</span>
</div>
</div>
<main class="pad"><div class="inner">{{SECOES}}</div></main>
<footer class="pad"><div class="inner"><span>Maia Imóveis · por Trilha Performance Digital</span><img src="trilha-logo-escura.png" alt="Trilha"></div></footer>
</body>
</html>
